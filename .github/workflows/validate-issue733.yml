name: Validate issue 733 red-green

on:
  push:
    branches:
      - ci/733-nested-jsx-red-green

permissions:
  contents: read

concurrency:
  group: issue733-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-regression:
    if: github.repository == 'huyanxius/editor'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.19.0'

      - name: Install locked dependencies and browsers
        run: |
          npm ci
          npm exec -- playwright install --with-deps chromium firefox webkit
          git rev-parse HEAD
          node --version
          npm --version
          npm exec -- playwright --version
          sha256sum package-lock.json

      - name: Check types, lint, unit tests, and build
        run: |
          npm run typecheck
          npm run lint
          npm run test:once -- --maxWorkers=2 --minWorkers=1
          npm run build

      - name: Confirm the original export omits nested JSX imports in all three browsers
        shell: bash
        run: |
          git show 122347cff8af5e9e1291b52789d22ed3ba0dc2ba:src/exportMarkdownFromLexical.ts > src/exportMarkdownFromLexical.ts
          set +e
          ISSUE733_REPORT=baseline-results.json npm exec -- playwright test --config=playwright.issue733.config.ts --grep 'inserting JSX into an admonition'
          status=$?
          set -e
          git restore --source=HEAD -- src/exportMarkdownFromLexical.ts
          test "$status" -eq 1
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const report = JSON.parse(readFileSync('baseline-results.json', 'utf8'))
          assert.deepEqual(report.errors, [], 'No setup or runner errors are allowed')
          const collect = (suites) => suites.flatMap((suite) => [
            ...suite.specs.flatMap((spec) => spec.tests),
            ...collect(suite.suites ?? [])
          ])
          const tests = collect(report.suites)
          assert.equal(tests.length, 3)
          assert.deepEqual(tests.map((test) => test.projectName).sort(), ['chromium', 'firefox', 'webkit'])
          for (const test of tests) {
            assert.equal(test.status, 'unexpected')
            assert.equal(test.results.length, 1)
            const result = test.results[0]
            assert.equal(result.status, 'failed')
            assert.equal(result.errors.length, 1)
            assert.match(result.errors[0].message, /Nested JSX must receive a root-level import/)
          }
          assert.equal(report.stats.unexpected, 3)
          assert.equal(report.stats.expected, 0)
          assert.equal(report.stats.skipped, 0)
          assert.equal(report.stats.flaky, 0)
          console.log('BASELINE VERIFIED: the missing-import assertion failed in Chromium, Firefox, and WebKit.')
          console.log(JSON.stringify(report.stats))
          NODE

      - name: Verify nested JSX insertion, shared imports, tables, and save/reload
        shell: bash
        run: |
          git diff --exit-code -- src/exportMarkdownFromLexical.ts
          ISSUE733_REPORT=candidate-results.json npm exec -- playwright test --config=playwright.issue733.config.ts
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const report = JSON.parse(readFileSync('candidate-results.json', 'utf8'))
          assert.deepEqual(report.errors, [])
          assert.equal(report.stats.expected, 9)
          assert.equal(report.stats.unexpected, 0)
          assert.equal(report.stats.skipped, 0)
          assert.equal(report.stats.flaky, 0)
          console.log('CANDIDATE VERIFIED: all 9 nested JSX insertion and save/reload cases passed.')
          console.log(JSON.stringify(report.stats))
          NODE
